name: CI

# Only on pull requests and inside deploy.yml: a push to a branch with an open pull
# request would otherwise run it twice.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test; empty for the commit of the event (a redeploy passes an earlier one).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pre-commit ‖ Tests ‖ Audit, and Coverage inside the deploy (map and inputs:
  # turfbook-workflows/README.md). The tests need a Postgres server and an admin with the
  # RDS master privileges (no superuser), created by the setup script.
  ci:
    uses: Fabio244000/turfbook-workflows/.github/workflows/python-ci.yml@34a36b2693d259d0ae9332f9f508020b32a03807 # main
    with:
      ref: ${{ inputs.ref }}
      postgres-db: postgres
      ci-env: |
        MASTER_DB_HOST=localhost
        MASTER_DB_USER=provisioner_admin
        MASTER_DB_PASSWORD=ci-only-not-a-real-secret
      setup-script: scripts/ci/create_ci_admin.sh
