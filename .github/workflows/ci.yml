name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    # develop runs CI inside deploy.yml (workflow_call), not twice.
    branches-ignore: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MASTER_DB_HOST: localhost
      MASTER_DB_USER: provisioner_admin
      MASTER_DB_PASSWORD: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Create the RDS-like admin
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -v admin_user="$MASTER_DB_USER" -v admin_password="$MASTER_DB_PASSWORD"
          -f scripts/database/create_local_admin.sql
        env:
          PGPASSWORD: postgres

      - name: Tests
        run: pytest
